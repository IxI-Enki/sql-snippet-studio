<svg width="128" height="128" viewBox="0 0 128 128" xmlns="http://www.w3.org/2000/svg">
  <!-- Background Circle -->
  <circle cx="64" cy="64" r="60" fill="#2C5F7C" stroke="#1A3A4D" stroke-width="3"/>
  
  <!-- Star Schema - Center Star -->
  <polygon points="64,25 72,48 96,48 76,62 84,85 64,71 44,85 52,62 32,48 56,48" 
           fill="#FFD700" stroke="#FFA500" stroke-width="2"/>
  
  <!-- Database Table Icons (4 corners around star) -->
  <!-- Top Table -->
  <rect x="54" y="12" width="20" height="8" rx="2" fill="#E8F4F8" stroke="#5DADE2" stroke-width="1.5"/>
  <line x1="56" y1="15" x2="72" y2="15" stroke="#5DADE2" stroke-width="0.8"/>
  <line x1="56" y1="17.5" x2="72" y2="17.5" stroke="#5DADE2" stroke-width="0.8"/>
  
  <!-- Right Table -->
  <rect x="92" y="56" width="20" height="8" rx="2" fill="#E8F4F8" stroke="#5DADE2" stroke-width="1.5"/>
  <line x1="94" y1="59" x2="110" y2="59" stroke="#5DADE2" stroke-width="0.8"/>
  <line x1="94" y1="61.5" x2="110" y2="61.5" stroke="#5DADE2" stroke-width="0.8"/>
  
  <!-- Bottom Table -->
  <rect x="54" y="92" width="20" height="8" rx="2" fill="#E8F4F8" stroke="#5DADE2" stroke-width="1.5"/>
  <line x1="56" y1="95" x2="72" y2="95" stroke="#5DADE2" stroke-width="0.8"/>
  <line x1="56" y1="97.5" x2="72" y2="97.5" stroke="#5DADE2" stroke-width="0.8"/>
  
  <!-- Left Table -->
  <rect x="16" y="56" width="20" height="8" rx="2" fill="#E8F4F8" stroke="#5DADE2" stroke-width="1.5"/>
  <line x1="18" y1="59" x2="34" y2="59" stroke="#5DADE2" stroke-width="0.8"/>
  <line x1="18" y1="61.5" x2="34" y2="61.5" stroke="#5DADE2" stroke-width="0.8"/>
  
  <!-- Connection Lines (Star Schema connections) -->
  <line x1="64" y1="35" x2="64" y2="20" stroke="#5DADE2" stroke-width="2" stroke-dasharray="3,2" opacity="0.7"/>
  <line x1="76" y1="64" x2="92" y2="64" stroke="#5DADE2" stroke-width="2" stroke-dasharray="3,2" opacity="0.7"/>
  <line x1="64" y1="78" x2="64" y2="92" stroke="#5DADE2" stroke-width="2" stroke-dasharray="3,2" opacity="0.7"/>
  <line x1="52" y1="64" x2="36" y2="64" stroke="#5DADE2" stroke-width="2" stroke-dasharray="3,2" opacity="0.7"/>
  
  <!-- Bottom Label "DBI" -->
  <text x="64" y="118" font-family="Arial, sans-serif" font-size="16" font-weight="bold" 
        fill="#FFFFFF" text-anchor="middle">DBI</text>
</svg>
