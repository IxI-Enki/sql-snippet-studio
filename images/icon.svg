<svg width="128" height="128" viewBox="0 0 128 128" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="DBI Test Survival Kit">
  <defs>
    <linearGradient id="bg" x1="16" y1="8" x2="112" y2="120" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#163a4d"/>
      <stop offset="1" stop-color="#2a7f9e"/>
    </linearGradient>
    <linearGradient id="hub" x1="44" y1="36" x2="84" y2="76" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#ffd166"/>
      <stop offset="1" stop-color="#f4a261"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="2" stdDeviation="2" flood-color="#0b2230" flood-opacity="0.35"/>
    </filter>
  </defs>

  <!-- App tile -->
  <rect x="8" y="8" width="112" height="112" rx="26" fill="url(#bg)"/>

  <!-- Survival kit cross (subtle) -->
  <g opacity="0.22" stroke="#e8f6fb" stroke-width="5" stroke-linecap="round">
    <line x1="64" y1="22" x2="64" y2="38"/>
    <line x1="56" y1="30" x2="72" y2="30"/>
  </g>

  <!-- Star-schema links -->
  <g stroke="#7ec8e3" stroke-width="2.5" stroke-linecap="round" opacity="0.9">
    <line x1="64" y1="56" x2="64" y2="34"/>
    <line x1="64" y1="56" x2="86" y2="56"/>
    <line x1="64" y1="56" x2="64" y2="78"/>
    <line x1="64" y1="56" x2="42" y2="56"/>
    <line x1="64" y1="56" x2="79" y2="41"/>
    <line x1="64" y1="56" x2="79" y2="71"/>
    <line x1="64" y1="56" x2="49" y2="71"/>
    <line x1="64" y1="56" x2="49" y2="41"/>
  </g>

  <!-- Dimension nodes -->
  <g fill="#dff3fa" stroke="#5eb8d6" stroke-width="2" filter="url(#shadow)">
    <rect x="56" y="26" width="16" height="12" rx="3"/>
    <rect x="88" y="50" width="16" height="12" rx="3"/>
    <rect x="56" y="78" width="16" height="12" rx="3"/>
    <rect x="24" y="50" width="16" height="12" rx="3"/>
    <circle cx="82" cy="36" r="6"/>
    <circle cx="82" cy="76" r="6"/>
    <circle cx="46" cy="76" r="6"/>
    <circle cx="46" cy="36" r="6"/>
  </g>

  <!-- Fact hub -->
  <polygon
    points="64,44 74,52 70,64 58,64 54,52"
    fill="url(#hub)"
    stroke="#e76f51"
    stroke-width="2"
    filter="url(#shadow)"
  />

  <!-- SQL chevrons -->
  <g fill="none" stroke="#f8fdff" stroke-width="3" stroke-linecap="round" stroke-linejoin="round">
    <path d="M34 96 L42 104 L34 112"/>
    <path d="M50 96 L58 104 L50 112"/>
    <path d="M70 104 L94 104"/>
  </g>

  <!-- Kit latch -->
  <rect x="44" y="100" width="40" height="10" rx="5" fill="#0f2d3d" stroke="#89d4ea" stroke-width="1.5"/>
  <circle cx="64" cy="105" r="2.5" fill="#ffd166"/>
</svg>
